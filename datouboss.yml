esphome:
  name: datouboss-controller
  friendly_name: "DT Datouboss Controller"

safe_mode:
  num_attempts: 10
  boot_is_good_after: 5s

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

esp32_ble:
  max_connections: 1

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  reboot_timeout: 10min
  ap:
    ssid: "Datouboss Fallback"
    password: !secret ap_password

mqtt:
  broker: !secret mqtt_broker
  port: 1883
  username: !secret mqtt_username
  password: !secret mqtt_password
  topic_prefix: datouboss
  idf_send_async: true
  log_topic: null
  discovery: false

ota:
  - platform: esphome
    password: !secret ota_password

api:
  reboot_timeout: 0s
  max_send_queue: 32
  batch_delay: 50ms

logger:
  baud_rate: 0
  level: INFO
  logs:
    esp32_ble_tracker: INFO
    esp32_ble_client: INFO
    growatt_bms: INFO

external_components:
  - source: github://syssi/esphome-jk-bms@main
    components: [ jk_bms_ble ]
  - source: components
    components: [ growatt_bms_server ]

# --- Bluetooth BLE для зв'язку з JK-BMS ---
esp32_ble_tracker:
  scan_parameters:
    interval: 1100ms
    window: 300ms
    active: false

ble_client:
  - mac_address: !secret jkbms_mac_address
    id: jkbms_ble_client

jk_bms_ble:
  - ble_client_id: jkbms_ble_client
    id: jkbms_device
    protocol_version: JK02_32S
    throttle: 5s

# --- Апаратні UART-порти ---
uart:
  # Контур 2: Моніторинг та керування інвертором Datouboss DT-1218 (RS485-1)
  - id: uart_datouboss
    rx_pin: GPIO27
    tx_pin: GPIO14
    baud_rate: 9600
    parity: NONE
    stop_bits: 1

  # Контур 1: Емуляція Growatt BMS Slave для порту BMS інвертора (RS485-2 BMS)
  - id: uart_growatt_bms
    rx_pin: GPIO17
    tx_pin: GPIO16
    baud_rate: 9600
    parity: NONE
    stop_bits: 1
    rx_buffer_size: 512

modbus:
  - id: modbus_datouboss
    uart_id: uart_datouboss
    send_wait_time: 250ms

modbus_controller:
  - id: datouboss_inverter
    address: 1
    modbus_id: modbus_datouboss
    command_throttle: 150ms
    max_cmd_retries: 0
    offline_skip_updates: 10
    setup_priority: -10
    update_interval: 15s

# --- Сенсори ---
sensor:
  # Системна діагностика
  - platform: wifi_signal
    name: "WiFi Signal"
    id: dt_wifi_signal
    update_interval: 60s

  - platform: uptime
    name: "Uptime"
    id: dt_uptime
    update_interval: 30s

  - platform: template
    name: "Free Heap"
    id: dt_free_heap
    unit_of_measurement: "kB"
    accuracy_decimals: 1
    device_class: data_size
    state_class: measurement
    entity_category: diagnostic
    icon: "mdi:memory"
    update_interval: 30s
    lambda: "return (float)esp_get_free_heap_size() / 1024.0f;"

  # Телеметрія інвертора Datouboss DT-1218
  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Inverter Status"
    id: inverter_status
    register_type: holding
    address: 0
    value_type: U_WORD
    icon: "mdi:power"

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "AC Voltage"
    id: ac_voltage
    register_type: holding
    address: 2
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    icon: "mdi:transmission-tower"

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "HV Bus Voltage"
    id: hv_bus_voltage
    register_type: holding
    address: 4
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1
    icon: "mdi:flash"

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Battery Voltage"
    id: battery_voltage
    register_type: holding
    address: 8
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1
    icon: "mdi:battery"


  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Transformer Temperature"
    id: transformer_temperature
    register_type: holding
    address: 15
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer-chevron-up"
    skip_updates: 2

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "DCDC Temperature"
    id: dcdc_temperature
    register_type: holding
    address: 16
    value_type: U_WORD
    unit_of_measurement: "°C"
    accuracy_decimals: 0
    device_class: temperature
    state_class: measurement
    icon: "mdi:thermometer-lines"
    skip_updates: 2

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "A12 Utility Charge Current"
    id: a12_charge_current
    register_type: holding
    address: 12
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 0
    device_class: current
    state_class: measurement
    icon: "mdi:transmission-tower"
    skip_updates: 2

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "A14 Solar Charge Current"
    id: a14_charge_current
    register_type: holding
    address: 14
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 0
    device_class: current
    state_class: measurement
    icon: "mdi:solar-power"
    skip_updates: 2

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Battery Current"
    id: battery_current
    register_type: holding
    address: 17
    value_type: S_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 1
    device_class: current
    state_class: measurement
    filters:
      - multiply: 0.1
    icon: "mdi:current-dc"

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Battery SOC"
    id: battery_soc
    register_type: holding
    address: 20
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    device_class: battery
    state_class: measurement
    icon: "mdi:battery-high"
    skip_updates: 2

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Float Charge Voltage"
    id: float_charge_voltage
    register_type: holding
    address: 21
    value_type: U_WORD
    unit_of_measurement: "V"
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    filters:
      - multiply: 0.1
    icon: "mdi:battery-charging-wireless"
    skip_updates: 2

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Max Charge Current"
    id: max_charge_current
    register_type: holding
    address: 24
    value_type: U_WORD
    unit_of_measurement: "A"
    accuracy_decimals: 0
    device_class: current
    state_class: measurement
    icon: "mdi:lightning-bolt"
    skip_updates: 2

  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Max Current Limit"
    id: max_current_limit
    register_type: holding
    address: 51
    value_type: U_WORD
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:speedometer"
    skip_updates: 2

  # Телеметрія JK-BMS (по Bluetooth BLE)
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_device
    cell_voltage_1:
      name: "Cell 1 Voltage"
      id: cell_1_voltage
    cell_voltage_2:
      name: "Cell 2 Voltage"
      id: cell_2_voltage
    cell_voltage_3:
      name: "Cell 3 Voltage"
      id: cell_3_voltage
    cell_voltage_4:
      name: "Cell 4 Voltage"
      id: cell_4_voltage
    total_voltage:
      name: "JK Total Voltage"
      id: jk_total_voltage
    current:
      name: "JK Current"
      id: jk_current
    state_of_charge:
      name: "JK State of Charge"
      id: jk_soc
    capacity_remaining:
      name: "JK Remaining Capacity"
      id: jk_capacity_remaining
    mosfet_temperature:
      name: "JK MOS Temperature"
      id: jk_mos_temp
    min_cell_voltage:
      name: "JK Min Cell Voltage"
      id: jk_min_cell_voltage
    max_cell_voltage:
      name: "JK Max Cell Voltage"
      id: jk_max_cell_voltage
    delta_cell_voltage:
      name: "JK Delta Cell Voltage"
      id: jk_delta_cell_voltage
    charging_power:
      name: "JK Charging Power"
      id: jk_charging_power
    discharging_power:
      name: "JK Discharging Power"
      id: jk_discharging_power
    balancing_current:
      name: "JK Balancing Current"
      id: jk_balancing_current
      accuracy_decimals: 3
      icon: "mdi:seesaw"
    min_voltage_cell:
      name: "JK Min Voltage Cell"
      id: jk_min_voltage_cell
      accuracy_decimals: 0
    max_voltage_cell:
      name: "JK Max Voltage Cell"
      id: jk_max_voltage_cell
      accuracy_decimals: 0

  # Діагностика моста Growatt BMS
  - platform: template
    name: "Growatt BMS Rx Packets"
    id: growatt_rx_packets
    accuracy_decimals: 0
    icon: "mdi:counter"

  - platform: template
    name: "Growatt BMS Tx Packets"
    id: growatt_tx_packets
    accuracy_decimals: 0
    icon: "mdi:counter"

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP Address"
      id: ip_address
    ssid:
      name: "Connected SSID"
      id: connected_ssid

  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_device
    errors:
      name: "JK BMS Errors"
      id: jk_errors
    balancer_status:
      name: "JK Balancer Status"
      id: jk_balancer_status

  - platform: template
    name: "Growatt BMS Last Request"
    id: growatt_last_request
    icon: "mdi:code-json"

  - platform: template
    name: "Reset Reason"
    id: dt_reset_reason
    entity_category: diagnostic
    icon: "mdi:restart"
    update_interval: 60s
    lambda: |-
      switch (esp_reset_reason()) {
        case ESP_RST_POWERON: return {"Power On"};
        case ESP_RST_EXT: return {"External Pin (Reset Button)"};
        case ESP_RST_SW: return {"Software Reset (OTA/API)"};
        case ESP_RST_PANIC: return {"Crash / Exception Panic"};
        case ESP_RST_INT_WDT: return {"Interrupt Watchdog"};
        case ESP_RST_TASK_WDT: return {"Task Watchdog"};
        case ESP_RST_WDT: return {"Other Watchdog"};
        case ESP_RST_DEEPSLEEP: return {"Deep Sleep Wakeup"};
        case ESP_RST_BROWNOUT: return {"Brownout (Low Voltage)"};
        case ESP_RST_SDIO: return {"SDIO Reset"};
        default: return {"Unknown"};
      }

switch:
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_device
    charging:
      name: "jk_bms_charging"
      id: jk_switch_charging
    discharging:
      name: "jk_bms_discharging"
      id: jk_switch_discharging
    balancer:
      name: "jk_bms_balancer"
      id: jk_switch_balancer
    smart_sleep:
      name: "jk_bms_smart_sleep"
      id: jk_switch_smart_sleep

number:
  # Налаштування інвертора Datouboss A12 (Струм від мережі, Регістр 12)
  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "A12 Utility Current Setting"
    id: a12_charge_current_num
    address: 12
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    entity_category: config
    icon: "mdi:transmission-tower"
    min_value: 10
    max_value: 80
    step: 1
    use_write_multiple: true
    skip_updates: 2
    mode: 'box'

  # Налаштування інвертора Datouboss A14 (Загальний/сонячний струм, Регістр 14)
  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "A14 Solar Current Setting"
    id: a14_charge_current_num
    address: 14
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    entity_category: config
    icon: "mdi:solar-power"
    min_value: 10
    max_value: 80
    step: 1
    use_write_multiple: true
    skip_updates: 2
    mode: 'box'

  # Налаштування інвертора Datouboss (Регістр 24)
  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Max Charge Current Setting"
    id: max_charge_current_num
    address: 24
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "A"
    device_class: current
    entity_category: config
    icon: "mdi:battery-charging-high"
    min_value: 10
    max_value: 80
    step: 1
    use_write_multiple: true
    skip_updates: 2
    mode: 'box'

  # Налаштування інвертора Datouboss (Регістр 21)
  - platform: modbus_controller
    modbus_controller_id: datouboss_inverter
    name: "Float Voltage Setting"
    id: float_voltage_num
    address: 21
    register_type: holding
    value_type: U_WORD
    unit_of_measurement: "V"
    device_class: voltage
    entity_category: config
    icon: "mdi:battery-charging-wireless"
    min_value: 13.0
    max_value: 14.6
    step: 0.1
    use_write_multiple: true
    skip_updates: 2
    lambda: "return (float)x * 0.1;"
    write_lambda: "return (uint16_t)(roundf(x * 10.0f));"
    mode: 'box'

  # Налаштування ліміту струму, що транслюється в порт BMS інвертора
  - platform: template
    name: "BMS Max Charge Current"
    id: bms_max_charge_current
    min_value: 10
    max_value: 150
    step: 1
    initial_value: 65
    optimistic: true
    unit_of_measurement: "A"
    icon: "mdi:battery-charging-high"
    mode: 'box'

# --- Бінарні сенсори ---
binary_sensor:
  - platform: jk_bms_ble
    jk_bms_ble_id: jkbms_device
    balancing:
      name: "JK Balancing Active"
      id: jk_balancing_active

# --- Шлюз емуляції Growatt BMS (Контур 1) ---
growatt_bms_server:
  id: growatt_bridge
  uart_id: uart_growatt_bms
  voltage_sensor: jk_total_voltage
  current_sensor: jk_current
  soc_sensor: jk_soc
  temp_sensor: jk_mos_temp
  max_charge_current_number: bms_max_charge_current
  rx_packets_sensor: growatt_rx_packets
  tx_packets_sensor: growatt_tx_packets
  last_request_sensor: growatt_last_request
  cell_1_sensor: cell_1_voltage
  cell_2_sensor: cell_2_voltage
  cell_3_sensor: cell_3_voltage
  cell_4_sensor: cell_4_voltage
  capacity_sensor: jk_capacity_remaining
  delta_voltage_sensor: jk_delta_cell_voltage
